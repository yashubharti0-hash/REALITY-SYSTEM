
name: Build REALITY SYSTEM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip REALITY_SYSTEM_Android_Project.zip

      - name: Build APK
        run: gradle -p REALITY_SYSTEM assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REALITY-SYSTEM-APK
          path: REALITY_SYSTEM/app/build/outputs/apk/debug/app-debug.apk
